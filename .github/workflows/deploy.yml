name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Set up Node (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run code formatter
        run: pnpm format.fix

      - name: Run TypeScript type‑check (acts as lint)
        run: pnpm typecheck

      - name: Check for test files
        id: check_tests
        shell: bash
        run: |
          if git ls-files | grep -E '\.(test|spec)\.(c|m)?[jt]sx?
      - name: Run tests
        if: steps.check_tests.outputs.tests_exist == 'true'
        run: pnpm test

      - name: Build project
        run: pnpm build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/spa
          force_orphan: true
 | grep -q .; then
            echo "tests_exist=true" >> "$GITHUB_OUTPUT"
          else
            echo "tests_exist=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.check_tests.outputs.tests_exist == 'true'
        run: pnpm test

      - name: Build project
        run: pnpm build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/spa
          force_orphan: true
